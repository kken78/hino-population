# 転記した値の検算と data.js の再生成の確認。
# プルリクエストと main への push のたびに tools/build_data.py を実行し、
# 作り直した data.js がコミットされたものと一致するかを確かめる。
# あわせて、index.html の共通の部品が hino-portal の正本（shared/）と同じかと、
# 文字の大きさ（静的検査と、幅 360px と 1024px での実寸）を確かめる。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 検算と data.js の作り直し(build_data.py)
        run: python3 tools/build_data.py

      - name: data.js がコミットされたものと一致するか
        run: |
          if ! git diff --exit-code --stat -- data.js; then
            echo "::error::data.js が data/population.json から作り直した結果と一致しません。python3 tools/build_data.py を実行してコミットしてください。"
            exit 1
          fi

      # 文字の大きさは hino-portal DESIGN.md 5.2（DESIGN.md ADR-3）
      - name: 共通の部品と文字の大きさ（hino-portal の shared/check.py）
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py --fonts index.html

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 実ブラウザでの文字の大きさと横のはみ出し（hino-portal の shared/check_mobile.mjs）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs node /tmp/hino-portal/shared/check_mobile.mjs index.html
