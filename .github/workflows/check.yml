# 転記した値の検算と data.js の再生成の確認。
# プルリクエストと main への push のたびに tools/build_data.py を実行し、
# 作り直した data.js がコミットされたものと一致するかを確かめる。
# あわせて、index.html の共通の部品が hino-portal の正本（shared/）と同じかを確かめる。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 検算と data.js の作り直し(build_data.py)
        run: python3 tools/build_data.py

      - name: data.js がコミットされたものと一致するか
        run: |
          if ! git diff --exit-code --stat -- data.js; then
            echo "::error::data.js が data/population.json から作り直した結果と一致しません。python3 tools/build_data.py を実行してコミットしてください。"
            exit 1
          fi

      - name: 共通の部品が hino-portal の正本と同じか
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py index.html
